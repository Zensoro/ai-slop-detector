name: AI-Slop Weekly Digest
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write          # to commit digest/latest.md
  issues: write            # to post the digest comment (if DIGEST_ISSUE set)
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate weekly digest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_ISSUE: ${{ vars.AI_SLOP_DIGEST_ISSUE }}
        run: |
          ARGS="--repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --days 7"
          if [ -n "$DIGEST_ISSUE" ]; then ARGS="$ARGS --comment-issue $DIGEST_ISSUE"; fi
          python src/digest.py $ARGS --out digest/latest.md
      - name: Commit digest
        run: |
          git config user.name "ai-slop[bot]"
          git config user.email "ai-slop@users.noreply.github.com"
          git add digest/latest.md
          git diff --cached --quiet || git commit -m "chore: weekly AI-slop digest"
          git push
