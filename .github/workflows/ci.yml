name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m py_compile src/*.py scripts/*.py
      - name: Run test suite (offline, no token)
        run: |
          python tests/test_scorer.py
          python tests/test_aggregate.py
          python tests/test_digest.py
          python tests/test_e2e.py
